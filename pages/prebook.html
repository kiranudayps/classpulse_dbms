<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
    <title>Pre-Book a Classroom — NIE ClassPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: { extend: {
          colors: { "primary": "#137fec", "background-light": "#f6f7f8", "background-dark": "#101922" },
          fontFamily: { "display": ["Lexend"] },
        }},
      }
    </script>
    <style>
        body { font-family: 'Lexend', sans-serif; }
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
    </style>
</head>
<body class="bg-background-light/80 dark:bg-background-dark/80 text-slate-900 dark:text-slate-100 font-display min-h-screen transition-colors">

<!-- Background Video -->
<video autoplay muted loop id="bg-video">
  <source src="/mp_.mp4" type="video/mp4">
</video>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-none px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-slate-500 dark:text-gray-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>Back</span>
            </a>
            
            <a href="/" class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-3xl">pulse_alert</span>
                <span class="text-xl font-bold">NIE ClassPulse</span>
            </a>

            <button onclick="toggleTheme()" class="size-9 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <span id="theme-icon" class="material-symbols-outlined text-slate-600 dark:text-slate-300 text-xl">dark_mode</span>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-8 shadow-sm">
            <div class="flex flex-col items-center justify-center py-10 text-center">
                <div class="w-20 h-20 bg-slate-200 dark:bg-slate-800 rounded-full flex items-center justify-center mb-6">
                    <span class="material-symbols-outlined text-4xl text-primary">add_circle</span>
                </div>
                <h1 class="text-3xl font-bold mb-3">Pre-Book a Classroom</h1>
                <p class="text-slate-500 dark:text-gray-400 max-w-md leading-relaxed">
                    Reserve a classroom in advance. Fill in the details below and submit your request.
                </p>
            </div>

            <form id="prebook-form" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
                        Room number
                        <input id="prebook-room" type="text" required placeholder="e.g. MB 101"
                               class="mt-2 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-4 py-3 text-sm text-slate-900 dark:text-white focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20" />
                    </label>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
                        Day
                        <input id="prebook-day" type="text" required placeholder="e.g. Monday"
                               class="mt-2 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-4 py-3 text-sm text-slate-900 dark:text-white focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20" />
                    </label>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
                        Start time
                        <input id="prebook-start" type="time" required
                               class="mt-2 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-4 py-3 text-sm text-slate-900 dark:text-white focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20" />
                    </label>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
                        End time
                        <input id="prebook-end" type="time" required
                               class="mt-2 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-4 py-3 text-sm text-slate-900 dark:text-white focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20" />
                    </label>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
                        Subject
                        <input id="prebook-subject" type="text" required placeholder="e.g. Physics"
                               class="mt-2 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-4 py-3 text-sm text-slate-900 dark:text-white focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20" />
                    </label>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300">
                        Section
                        <input id="prebook-section" type="text" placeholder="e.g. A1"
                               class="mt-2 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-4 py-3 text-sm text-slate-900 dark:text-white focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20" />
                    </label>
                </div>

                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <button id="prebook-submit" type="submit"
                            class="inline-flex items-center justify-center rounded-2xl bg-primary px-6 py-3 text-sm font-semibold text-white hover:bg-primary/90 transition-colors">
                        Submit Reservation
                    </button>
                    <a href="/" class="text-sm text-slate-500 dark:text-slate-400 hover:text-primary transition-colors">
                        Back to Dashboard
                    </a>
                </div>

                <p id="prebook-message" class="text-sm text-center text-green-600 dark:text-green-400 hidden"></p>
            </form>
        </div>
    </main>

    <script>
        // Theme toggle — same logic as index.html
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const el = document.getElementById('theme-icon');
            if (el) el.textContent = isDark ? 'light_mode' : 'dark_mode';
        }

        function showPrebookMessage(message, isError = false) {
            const msg = document.getElementById('prebook-message');
            if (!msg) return;
            msg.textContent = message;
            msg.classList.toggle('text-red-500', isError);
            msg.classList.toggle('text-green-600', !isError);
            msg.classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isDark = document.documentElement.classList.contains('dark');
            const el = document.getElementById('theme-icon');
            if (el) el.textContent = isDark ? 'light_mode' : 'dark_mode';

            const form = document.getElementById('prebook-form');
            if (!form) return;

            form.addEventListener('submit', event => {
                event.preventDefault();
                const room = document.getElementById('prebook-room')?.value.trim();
                const day = document.getElementById('prebook-day')?.value.trim();
                const start = document.getElementById('prebook-start')?.value;
                const end = document.getElementById('prebook-end')?.value;
                const subject = document.getElementById('prebook-subject')?.value.trim();
                const section = document.getElementById('prebook-section')?.value.trim();

                if (!room || !day || !start || !end || !subject) {
                    showPrebookMessage('Please fill in all required fields.', true);
                    return;
                }

                const booking = {
                    id: Date.now(),
                    room,
                    day,
                    start_time: start,
                    end_time: end,
                    subject,
                    section: section || 'N/A',
                    status: 'prebooked',
                    created_at: new Date().toISOString()
                };

                const saved = JSON.parse(localStorage.getItem('classpulse_prebookings') || '[]');
                saved.push(booking);
                localStorage.setItem('classpulse_prebookings', JSON.stringify(saved));

                showPrebookMessage('Reservation saved. Redirecting to Reserved Classes...');
                setTimeout(() => window.location.href = '/pages/reserved.html', 900);
            });
        });
    </script>
</body>
</html>
