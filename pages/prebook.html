<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Book a Class</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body { font-family: 'Lexend', sans-serif; }
</style>
</head>

<body class="bg-slate-900 text-white min-h-screen">

<header class="p-4 border-b border-slate-700 flex justify-between">
  <h1 class="font-bold">NIE ClassPulse</h1>
</header>

<main class="max-w-6xl mx-auto p-6">

  <h2 class="text-2xl font-bold mb-6">Pre-Book a Class</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- LEFT FORM -->
    <div class="bg-slate-800 p-6 rounded-xl">

      <label>Date</label>
      <input id="date" type="date" class="w-full mb-3 p-2 rounded bg-slate-700"/>

      <div class="flex gap-3 mb-3">
        <input id="start" type="time" class="w-full p-2 rounded bg-slate-700"/>
        <input id="end" type="time" class="w-full p-2 rounded bg-slate-700"/>
      </div>

      <input id="subject" placeholder="Subject" class="w-full mb-3 p-2 rounded bg-slate-700"/>

      <button id="searchBtn"
        class="w-full bg-blue-600 py-3 rounded-lg font-semibold">
        Find Available Rooms
      </button>

    </div>

    <!-- RIGHT RESULT -->
    <div>

      <h3 class="font-bold mb-3">Available Rooms</h3>

      <div id="loading" class="hidden">Loading...</div>

      <div id="empty" class="hidden text-gray-400">
        No rooms available
      </div>

      <div id="rooms"></div>

    </div>

  </div>

</main>

<script>
document.getElementById("searchBtn").addEventListener("click", async () => {

  const date = document.getElementById("date").value;
  const start = document.getElementById("start").value;
  const end = document.getElementById("end").value;

  if (!date || !start || !end) {
    alert("Fill all fields");
    return;
  }

  const day = new Date(date).toLocaleDateString('en-US', { weekday: 'long' });

  document.getElementById("loading").classList.remove("hidden");
  document.getElementById("rooms").innerHTML = "";
  document.getElementById("empty").classList.add("hidden");

  try {
    const res = await fetch(`/api/available-rooms?day=${day}&start=${start}&end=${end}`);
    const data = await res.json();

    document.getElementById("loading").classList.add("hidden");

    if (!data.length) {
      document.getElementById("empty").classList.remove("hidden");
      return;
    }

    document.getElementById("rooms").innerHTML = data.map(r => `
      <div class="bg-slate-800 p-3 rounded mb-2 flex justify-between">
        <span>${r.room_number}</span>
        <button class="bg-green-600 px-3 py-1 rounded">Book</button>
      </div>
    `).join("");

  } catch (err) {
    console.error(err);
  }

});
</script>

</body>
</html>
