<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserved Classes — NIE ClassPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #0f172a !important;
            color: #e5e7eb !important;
        }
        h1, h2, h3, p, span {
            color: #e5e7eb !important;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-gray-200 font-['Lexend'] min-h-screen">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-[#0f172a]/80 backdrop-blur-md border-b border-gray-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>Back</span>
            </a>
            
            <a href="/" class="flex items-center gap-2">
                <span class="material-symbols-outlined text-blue-500 text-3xl">pulse_alert</span>
                <span class="text-xl font-bold bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">NIE ClassPulse</span>
            </a>

            <a href="/pages/prebook.html" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all shadow-lg shadow-blue-900/20">
                <span class="material-symbols-outlined">add_circle</span>
                <span class="hidden sm:inline">Pre-Book a Class</span>
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Reserved Classes</h1>
            <p class="text-gray-400">Upcoming pre-booked classrooms</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-gray-500">Fetching reservations...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 bg-gray-800/50 rounded-full flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-4xl text-gray-600">event_busy</span>
            </div>
            <h2 class="text-xl font-semibold text-white mb-2">No upcoming reservations</h2>
            <p class="text-gray-400">No classrooms have been pre-booked yet.</p>
        </div>

        <!-- Bookings Grid -->
        <div id="bookings-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <script>
        // Show empty state after a brief delay (no Supabase in local MySQL version)
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
        }, 800);
    </script>
</body>
</html>
