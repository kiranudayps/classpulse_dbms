<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
    <title>Reserved Classes — NIE ClassPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: { extend: {
          colors: { "primary": "#137fec", "background-light": "#f6f7f8", "background-dark": "#101922" },
          fontFamily: { "display": ["Lexend"] },
        }},
      }
    </script>
    <style>
        body { font-family: 'Lexend', sans-serif; }
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
    </style>
</head>
<body class="bg-background-light/80 dark:bg-background-dark/80 text-slate-900 dark:text-slate-100 font-display min-h-screen transition-colors">

<!-- Background Video -->
<video autoplay muted loop id="bg-video">
  <source src="/mp_.mp4" type="video/mp4">
</video>

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-none px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-slate-500 dark:text-gray-400 hover:text-primary transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
                <span>Back</span>
            </a>
            
            <a href="/" class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-3xl">pulse_alert</span>
                <span class="text-xl font-bold">NIE ClassPulse</span>
            </a>

            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" class="size-9 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <span id="theme-icon" class="material-symbols-outlined text-slate-600 dark:text-slate-300 text-xl">dark_mode</span>
                </button>
                <a id="prebook-btn-reserved" href="/pages/prebook.html" style="display:none" class="flex items-center gap-2 bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg transition-all">
                    <span class="material-symbols-outlined">add_circle</span>
                    <span class="hidden sm:inline">Pre-Book a Class</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold mb-2">Reserved Classes</h1>
            <p class="text-slate-500 dark:text-gray-400">Upcoming pre-booked classrooms</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-500 dark:text-gray-500">Fetching reservations...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 bg-slate-200 dark:bg-gray-800/50 rounded-full flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-4xl text-slate-400 dark:text-gray-600">event_busy</span>
            </div>
            <h2 class="text-xl font-semibold mb-2">No upcoming reservations</h2>
            <p class="text-slate-500 dark:text-gray-400">No classrooms have been pre-booked yet.</p>
        </div>

        <!-- Bookings Grid -->
        <div id="bookings-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here -->
        </div>
    </main>

    <script>
        // Theme toggle — same logic as index.html
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const el = document.getElementById('theme-icon');
            if (el) el.textContent = isDark ? 'light_mode' : 'dark_mode';
        }

        function formatTime(t) {
            if (!t) return '';
            // t is HH:MM:SS or HH:MM
            const parts = t.split(':');
            let h = parseInt(parts[0]);
            const m = parts[1];
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${h}:${m} ${ampm}`;
        }

        function formatDate(d) {
            if (!d) return '';
            const date = new Date(d);
            return date.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
        }

        async function renderBookings() {
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty-state');
            const grid = document.getElementById('bookings-grid');

            try {
                const res = await fetch('/api/bookings');
                const bookings = await res.json();

                if (loading) loading.classList.add('hidden');

                if (!Array.isArray(bookings) || !bookings.length) {
                    if (loading) loading.classList.add('hidden');
                    if (empty) {
                        if (!Array.isArray(bookings) && bookings.error) {
                            empty.querySelector('h2').textContent = 'Failed to load reservations';
                            empty.querySelector('p').textContent = 'Server error: ' + bookings.error;
                        }
                        empty.classList.remove('hidden');
                    }
                    if (grid) grid.classList.add('hidden');
                    return;
                }

                if (empty) empty.classList.add('hidden');
                if (grid) {
                    grid.innerHTML = bookings.map(booking => `
                        <article id="booking-${booking.id}" class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 p-6 shadow-sm transition-all duration-300">
                            <div class="flex items-center justify-between gap-3 mb-5">
                                <div>
                                    <p class="text-sm uppercase tracking-[0.2em] text-slate-400 dark:text-slate-500">${formatDate(booking.date)}</p>
                                    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">Room ${booking.room_number}</h2>
                                </div>
                                <span class="inline-flex rounded-full bg-primary/10 text-primary px-3 py-1 text-xs font-semibold uppercase">Reserved</span>
                            </div>
                            <div class="grid gap-3 text-slate-600 dark:text-slate-300 text-sm mb-5">
                                <p><span class="font-semibold text-slate-900 dark:text-white">Subject:</span> ${booking.subject}</p>
                                ${booking.faculty ? `<p><span class="font-semibold text-slate-900 dark:text-white">Faculty:</span> ${booking.faculty}</p>` : ''}
                                <p><span class="font-semibold text-slate-900 dark:text-white">Booked For:</span> ${booking.target_section || 'N/A'}</p>
                                <p><span class="font-semibold text-slate-900 dark:text-white">Time:</span> ${formatTime(booking.start_time)} – ${formatTime(booking.end_time)}</p>
                            </div>
                            <button onclick="cancelBooking(${booking.id})"
                                class="w-full flex items-center justify-center gap-2 border border-red-400 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 px-4 py-2 rounded-xl text-sm font-semibold transition-colors">
                                <span class="material-symbols-outlined text-base">cancel</span>
                                Cancel Reservation
                            </button>
                        </article>
                    `).join('');
                    grid.classList.remove('hidden');
                }
            } catch (err) {
                if (loading) loading.classList.add('hidden');
                if (empty) {
                    empty.querySelector('h2').textContent = 'Failed to load reservations';
                    empty.querySelector('p').textContent = 'Could not connect to the server.';
                    empty.classList.remove('hidden');
                }
            }
        }

        async function cancelBooking(id) {
            if (!confirm('Cancel this reservation? This cannot be undone.')) return;

            try {
                const res = await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
                const data = await res.json();

                if (data.error) {
                    alert('Failed to cancel: ' + data.error);
                    return;
                }

                // Fade out and remove the card
                const card = document.getElementById('booking-' + id);
                if (card) {
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        card.remove();
                        // Show empty state if no bookings left
                        const grid = document.getElementById('bookings-grid');
                        if (grid && grid.children.length === 0) {
                            grid.classList.add('hidden');
                            const empty = document.getElementById('empty-state');
                            if (empty) {
                                empty.querySelector('h2').textContent = 'No upcoming reservations';
                                empty.querySelector('p').textContent = 'No classrooms have been pre-booked yet.';
                                empty.classList.remove('hidden');
                            }
                        }
                    }, 300);
                }
            } catch (err) {
                alert('Failed to cancel reservation. Please try again.');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isDark = document.documentElement.classList.contains('dark');
            const el = document.getElementById('theme-icon');
            if (el) el.textContent = isDark ? 'light_mode' : 'dark_mode';

            renderBookings();
        });

        // Show Pre-Book button only if logged in
        const user = localStorage.getItem('classpulse_user');
        if (user) {
            const btn = document.getElementById('prebook-btn-reserved');
            if (btn) btn.style.display = 'flex';
        }
    </script>
</body>
</html>
